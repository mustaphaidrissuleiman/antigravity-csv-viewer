<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#f0fdf4" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bgGrad)" />

  <!-- Sheet body -->
  <rect x="24" y="24" width="80" height="80" rx="10" fill="url(#sheetGrad)" />

  <!-- Header row bar -->
  <path d="M 24 34 C 24 28.5 28.5 24 34 24 L 94 24 C 99.5 24 104 28.5 104 34 L 104 42 L 24 42 Z" fill="#10b981" />

  <!-- Header column dividers -->
  <line x1="50" y1="26" x2="50" y2="40" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="78" y1="26" x2="78" y2="40" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Grid lines -->
  <!-- Horizontal rows -->
  <line x1="24" y1="58" x2="104" y2="58" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="24" y1="74" x2="104" y2="74" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="24" y1="90" x2="104" y2="90" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Vertical columns -->
  <line x1="50" y1="42" x2="50" y2="104" stroke="#e2e8f0" stroke-width="1.5" />
  <line x1="78" y1="42" x2="78" y2="104" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Cell content indicators (dots & bars) -->
  <!-- Row 1 -->
  <rect x="30" y="48" width="14" height="4" rx="2" fill="#64748b" opacity="0.8" />
  <rect x="56" y="48" width="16" height="4" rx="2" fill="#059669" opacity="0.9" />
  <rect x="84" y="48" width="14" height="4" rx="2" fill="#64748b" opacity="0.8" />

  <!-- Row 2 -->
  <rect x="30" y="64" width="12" height="4" rx="2" fill="#64748b" opacity="0.8" />
  <rect x="56" y="64" width="18" height="4" rx="2" fill="#059669" opacity="0.9" />
  <rect x="84" y="64" width="10" height="4" rx="2" fill="#64748b" opacity="0.8" />

  <!-- Row 3 -->
  <rect x="30" y="80" width="15" height="4" rx="2" fill="#64748b" opacity="0.8" />
  <rect x="56" y="80" width="12" height="4" rx="2" fill="#059669" opacity="0.9" />
  <rect x="84" y="80" width="15" height="4" rx="2" fill="#64748b" opacity="0.8" />

  <!-- CSV Badge on bottom right -->
  <g transform="translate(68, 76)">
    <rect x="0" y="0" width="42" height="34" rx="7" fill="#065f46" stroke="#ffffff" stroke-width="2" />
    <text x="21" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">CSV</text>
  </g>
</svg>
